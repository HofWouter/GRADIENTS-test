<!DOCTYPE html>
<head>
    <title>TOOL</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class= "canvas-container">
    <div class="container">
        <section class="sidebar">
                    <p class="textblok">Adjustments</p>
                    <div>
                     <input class="button" type="file" id="imageUpload" accept="image/*" />
                    <div class="button">                  
                        <input type="range" id="slider" value="0" min="0" max="400">
                    </div>
                    <div class="button">                  
                        <input type="range" id="speed" value="10" min="1" max="15">
                    </div>
                    <div class ="button">
                        <input type="range" id="sharpness" value="30" min="30" max="100">
                    </div>
                    <div class ="button">
                        <input type="range" id="alphaValue" value="2" min="0" max="255">
                    </div>
                    <div class="button">
                        <input type="color" id="colorpicker1" value="#000000">
                    </div>
                    <div class="button">
                        <input type="color" id="colorpicker2" value="#FFFFFF">
                    </div>
                    <input type="text" id="text"class="text-input" placeholder="write something...">                                          
                    </div>
                    <p class="textblok">File</p>
                    <div>
                    <button class="button" id="export" onclick="exportImage()">Export</button>
                    </div>                   
        </section>      
        <section id="canvasWrapper">
            <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.min.js"></script>
            <script src="sketch.js"></script>
            <script src="CANVAS.js"></script>  
            <script src="TYPO.js"></script>
            <script src="IMAGE.js"></script>
        </section>

    </div>



</body>
